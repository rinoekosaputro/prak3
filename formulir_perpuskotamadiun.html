<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Perpustakaan Kota Madiun</title>
</head>
<body>

    <h2>Formulir Pendaftaran Perpustakaan Kota Madiun</h2>

    <form action="#" method="get">

        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <label>Jenis Kelamin:</label>
        <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki">
        <label for="laki">Laki-laki</label>

        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
        <label for="perempuan">Perempuan</label>
        <br><br>

        <label>Hobi:</label>
        <input type="checkbox" id="membaca" name="hobi" value="Membaca">
        <label for="membaca">Membaca</label>

        <input type="checkbox" id="menulis" name="hobi" value="Menulis">
        <label for="menulis">Menulis</label>
        <br><br>

        <label for="alamat">Alamat:</label>
        <br>
        <textarea id="alamat" name="alamat" rows="4" cols="30"></textarea>
        <br><br>

        <label for="pendidikan">Pendidikan Terakhir:</label>
        <select id="pendidikan" name="pendidikan">
            <option value="SMP">SMP</option>
            <option value="SMA/SMK">SMA/SMK</option>
            <option value="D3">D3</option>
            <option value="S1">S1</option>
        </select>
        <br><br>

        <input type="submit" value="Daftar">

    </form>

</body>
</html>
